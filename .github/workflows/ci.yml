# This file is free software; see COPYING for copying conditions.
#
# The job runs in the official gcc:16.2-trixie image.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and run
    runs-on: ubuntu-24.04
    container: gcc:16.2-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Show the compiler
        run: g++ --version
      - name: Build
        run: g++ -std=c++17 -Wall -o interpreter interpreter.cpp
      - name: Run emoji/heart.b
        run: |
          output=$(./interpreter emoji/heart.b)
          printf '%s\n' "$output"
          test "$output" = '<3'
